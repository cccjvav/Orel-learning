<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <title>Lumen — learn with a guide</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <span class="brand-name">lumen</span>
        </div>

        <div class="profile-chip">
          <div class="avatar">AS</div>
          <div class="profile-copy"><strong>Alex Smith</strong><span>Curious learner</span></div>
          <button class="icon-button tiny" aria-label="Open profile menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg></button>
        </div>

        <p class="nav-label">Workspace</p>
        <nav class="primary-nav">
          <button class="nav-item active" data-view="home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-7h6v7"/></svg></span><span>Overview</span></button>
          <button class="nav-item" data-view="course"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg></span><span>My course</span><span class="nav-count">4</span></button>
          <button class="nav-item" data-view="practice"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 18c3-5 5 2 8-3s5 2 8-4"/><circle cx="18" cy="6" r="2.5"/></svg></span><span>Practice</span></button>
          <button class="nav-item" data-view="notes"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></span><span>My notes</span></button>
          <button class="nav-item" data-view="glossary"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v13H8a2 2 0 0 1-2-2V4Z"/><path d="M6 17V4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12M10 8h6M10 12h6"/></svg></span><span>Glossary</span></button>
        </nav>

        <p class="nav-label lower-label">Your progress</p>
        <div class="sidebar-progress">
          <div class="progress-ring small-ring"><span>62%</span></div>
          <div><strong>Keep the rhythm</strong><p>3 day streak · 12 min left</p></div>
        </div>

        <div class="sidebar-bottom">
          <button class="nav-item quiet"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.3a2 2 0 1 1-4 0v-.2A2 2 0 0 0 5.8 18l-.1.1a2 2 0 1 1-2.8-2.8L3 15.2A2 2 0 0 0 1.6 12h-.1a2 2 0 1 1 0-4h.2A2 2 0 0 0 3 4.6l-.1-.1A2 2 0 1 1 5.7 1.7l.1.1A2 2 0 0 0 9.2.4V.3a2 2 0 1 1 4 0v.2A2 2 0 0 0 16.6 2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A2 2 0 0 0 20.8 8h.2a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.4 3Z"/></svg></span><span>Settings</span></button>
          <button class="nav-item quiet"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2-2.4 3.3M12 16.6h.01"/></svg></span><span>Help center</span></button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="mobile-brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div><span class="brand-name">lumen</span></div>
          <div class="breadcrumb" id="breadcrumb"><span>Workspace</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><strong>Overview</strong></div>
          <div class="top-actions">
            <button class="streak-pill" title="Your current streak"><span class="fire">✦</span><strong>3</strong><span>day streak</span></button>
            <button class="icon-button" aria-label="Notifications" id="notificationBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg><i></i></button>
            <button class="mobile-menu icon-button" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          </div>
        </header>

        <div id="viewRoot"></div>

        <footer class="footer-note"><span class="sparkle">✦</span><span>Lumen is here to help you understand, not just remember.</span><button class="text-button" id="feedbackBtn">Share feedback <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12h14m-6-6 6 6-6 6"/></svg></button></footer>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close icon-button" id="modalClose" aria-label="Close dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <div id="modalContent"></div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
